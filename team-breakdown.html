<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mater League — Team Breakdown</title>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --navy-dark: #0B1F3A;
    --navy-mid: rgba(20, 42, 68, 0.85);
    --navy-line: #2A4A6E;
    --chalk: #F2F5F8;
    --chalk-dim: #9FB3C8;
    --gold: #F4C542;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--navy-dark);
    color: var(--chalk);
    font-family: 'Inter', sans-serif;
    line-height: 1.5;
  }

  .wrap {
    max-width: 960px;
    margin: 0 auto;
    padding: 0 20px;
  }

  header {
    text-align: center;
    padding: 56px 20px 36px;
    border-bottom: 1px solid var(--navy-line);
  }

  .wordmark {
    font-family: 'Bungee', cursive;
    font-weight: 400;
    font-size: clamp(1.8rem, 6vw, 2.6rem);
    color: var(--gold);
    margin: 0 0 10px;
  }

  .subtitle {
    color: var(--chalk-dim);
    font-size: 0.95rem;
    margin: 0;
  }

  main {
    padding: 40px 0 80px;
  }

  .status {
    text-align: center;
    color: var(--chalk-dim);
    padding: 40px 0;
  }

  .status.error {
    color: #E4574C;
  }

  .team-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 22px;
  }

  .team-card {
    background: var(--navy-mid);
    border: 1px solid var(--navy-line);
    border-radius: 8px;
    padding: 20px 22px;
  }

  .team-card .team-name {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 1.4rem;
    margin: 0;
    color: var(--gold);
  }

  .team-card .manager-name {
    color: var(--chalk-dim);
    font-size: 0.85rem;
    margin: 2px 0 18px;
  }

  .player-row {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 10px 0;
    border-top: 1px solid rgba(255,255,255,0.06);
  }

  .player-row:first-of-type {
    border-top: none;
  }

  .player-photo {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    object-fit: cover;
    background: var(--navy-line);
    flex-shrink: 0;
  }

  .player-photo-fallback {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: var(--navy-line);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 0.9rem;
    color: var(--chalk-dim);
    flex-shrink: 0;
  }

  .player-info {
    flex: 1;
    min-width: 0;
  }

  .player-name {
    font-weight: 600;
    font-size: 0.95rem;
  }

  .player-meta {
    color: var(--chalk-dim);
    font-size: 0.78rem;
  }

  .week-scores {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    justify-content: flex-end;
  }

  .week-score-chip {
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--navy-line);
    border-radius: 4px;
    padding: 3px 7px;
    font-size: 0.72rem;
    text-align: center;
    min-width: 38px;
  }

  .week-score-chip .wk-label {
    display: block;
    color: var(--chalk-dim);
    font-size: 0.62rem;
  }

  .week-score-chip .wk-val {
    display: block;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    color: var(--gold);
    font-size: 0.85rem;
  }

  footer {
    text-align: center;
    color: var(--chalk-dim);
    font-size: 0.82rem;
    padding: 24px 0 50px;
  }

  @media (max-width: 560px) {
    .player-row { flex-wrap: wrap; }
    .week-scores { justify-content: flex-start; width: 100%; margin-top: 6px; margin-left: 58px; }
  }
</style>
</head>
<body>

<header>
  <p class="wordmark" id="league-title">Mater League</p>
  <p class="subtitle">Team Breakdown — current rosters &amp; weekly scores</p>
</header>

<div class="wrap">
  <main>
    <div id="content">
      <p class="status">Loading teams…</p>
    </div>
  </main>
</div>

<footer>
  <p>Live from Sleeper. Refresh any time for the latest.</p>
</footer>

<script>
(async function () {
  const LEAGUE_ID = '1390750210698780672';
  const SPORT = 'clubsoccer:epl';
  const API = 'https://api.sleeper.app/v1';
  const PLAYERS_CACHE_KEY = 'sleeper_players_' + SPORT.replace(':', '_') + '_cache';
  const PLAYERS_CACHE_TS_KEY = PLAYERS_CACHE_KEY + '_ts';
  const CACHE_MAX_AGE_MS = 24 * 60 * 60 * 1000;

  function setError(msg) {
    document.getElementById('content').innerHTML = `<p class="status error">${msg}</p>`;
  }

  async function getAllPlayers() {
    try {
      const cachedTs = localStorage.getItem(PLAYERS_CACHE_TS_KEY);
      const cached = localStorage.getItem(PLAYERS_CACHE_KEY);
      if (cached && cachedTs && (Date.now() - Number(cachedTs) < CACHE_MAX_AGE_MS)) {
        return JSON.parse(cached);
      }
    } catch (e) {}
    const res = await fetch(`${API}/players/${SPORT}`);
    if (!res.ok) throw new Error('Failed to load player database');
    const data = await res.json();
    try {
      localStorage.setItem(PLAYERS_CACHE_KEY, JSON.stringify(data));
      localStorage.setItem(PLAYERS_CACHE_TS_KEY, String(Date.now()));
    } catch (e) {}
    return data;
  }

  function initials(name) {
    return name.split(' ').map(p => p[0]).filter(Boolean).slice(0, 2).join('').toUpperCase();
  }

  try {
    const [leagueRes, rostersRes, usersRes, stateRes] = await Promise.all([
      fetch(`${API}/league/${LEAGUE_ID}`, { cache: 'no-store' }),
      fetch(`${API}/league/${LEAGUE_ID}/rosters`, { cache: 'no-store' }),
      fetch(`${API}/league/${LEAGUE_ID}/users`, { cache: 'no-store' }),
      fetch(`${API}/state/${SPORT}`, { cache: 'no-store' })
    ]);

    if (!leagueRes.ok || !rostersRes.ok || !usersRes.ok) {
      throw new Error('Could not reach the Sleeper API.');
    }

    const league = await leagueRes.json();
    const rosters = await rostersRes.json();
    const users = await usersRes.json();
    const allPlayers = await getAllPlayers();
    const state = stateRes.ok ? await stateRes.json() : null;
    const currentWeek = (state && (state.leg || state.week)) || 1;
    const season = league.season || (state && state.season) || String(new Date().getFullYear());
    const scoringSettings = league.scoring_settings || {};

    if (league && league.name) {
      document.getElementById('league-title').textContent = league.name;
    }

    // Only show weeks that have actually been scored, so we don't show a wall of zeros
    // for the current in-progress or future weeks.
    const lastScoredWeek = state && state.last_scored_leg ? state.last_scored_leg : Math.max(0, currentWeek - 1);
    const weeksToShow = [];
    for (let w = 1; w <= lastScoredWeek; w++) weeksToShow.push(w);

    // Fetch stats for every scored week up front
    const statsByWeek = {};
    await Promise.all(weeksToShow.map(async (w) => {
      try {
        const res = await fetch(`${API}/stats/${SPORT}/regular/${season}/${w}`, { cache: 'no-store' });
        statsByWeek[w] = res.ok ? await res.json() : {};
      } catch (e) {
        statsByWeek[w] = {};
      }
    }));

    function fantasyPointsFor(pid, weekStats) {
      const line = weekStats ? weekStats[pid] : null;
      if (!line) return null;
      let total = 0;
      Object.keys(line).forEach(key => {
        if (key.startsWith('pos_') && scoringSettings[key] !== undefined) {
          total += Number(line[key]) * Number(scoringSettings[key]);
        }
      });
      return total;
    }

    const usersById = {};
    users.forEach(u => { usersById[u.user_id] = u; });

    function teamNameFor(roster) {
      const u = usersById[roster.owner_id];
      if (u && u.metadata && u.metadata.team_name) return u.metadata.team_name;
      if (u) return u.display_name + "'s Team";
      return 'Unknown Team';
    }

    function managerNameFor(roster) {
      const u = usersById[roster.owner_id];
      return u ? u.display_name : 'Unknown Manager';
    }

    function playerInfo(pid) {
      const p = allPlayers[pid];
      if (!p) return { name: `Player ${pid}`, team: '', pos: '' };
      const name = p.full_name || `${p.first_name || ''} ${p.last_name || ''}`.trim() || pid;
      return { name, team: p.team || 'FA', pos: p.position || '' };
    }

    // Best-effort guess at Sleeper's soccer player photo URL, following their known
    // NFL pattern. Not confirmed for clubsoccer — falls back to initials if it 404s.
    function playerPhotoUrl(pid) {
      return `https://sleepercdn.com/content/${SPORT}/players/${pid}.jpg`;
    }

    const cardsHtml = rosters.map(roster => {
      const playerIds = roster.players || [];

      const playersHtml = playerIds.map(pid => {
        const info = playerInfo(pid);
        const chips = weeksToShow.map(w => {
          const pts = fantasyPointsFor(pid, statsByWeek[w]);
          return `
            <div class="week-score-chip">
              <span class="wk-label">Wk${w}</span>
              <span class="wk-val">${pts !== null ? Number(pts).toFixed(1) : '–'}</span>
            </div>
          `;
        }).join('');

        return `
          <div class="player-row">
            <img class="player-photo" src="${playerPhotoUrl(pid)}" alt=""
                 onerror="this.outerHTML='<div class=&quot;player-photo-fallback&quot;>${initials(info.name)}</div>'" />
            <div class="player-info">
              <div class="player-name">${info.name}</div>
              <div class="player-meta">${info.pos}${info.team ? ' · ' + info.team : ''}</div>
            </div>
            <div class="week-scores">${chips || '<span class="player-meta">No scored weeks yet</span>'}</div>
          </div>
        `;
      }).join('');

      return `
        <div class="team-card">
          <p class="team-name">${teamNameFor(roster)}</p>
          <p class="manager-name">Managed by ${managerNameFor(roster)}</p>
          ${playersHtml || '<p class="player-meta">No players on roster yet</p>'}
        </div>
      `;
    }).join('');

    document.getElementById('content').innerHTML = `<div class="team-grid">${cardsHtml}</div>`;

  } catch (err) {
    console.error(err);
    setError(`Couldn't load league data: ${err.message}`);
  }
})();
</script>

</body>
</html>
