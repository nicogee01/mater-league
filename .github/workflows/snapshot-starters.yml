name: Snapshot Weekly Starters

on:
  schedule:
    - cron: '*/5 * * * *'   # every 5 minutes — GitHub's minimum allowed interval
  workflow_dispatch: {}      # lets you also trigger it manually from the Actions tab

permissions:
  contents: write            # needed so the workflow can commit updated files back

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests openpyxl

      - name: Run snapshot script
        run: python scripts/snapshot_starters.py

      - name: Commit changes if anything was recorded
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add starters.xlsx data/last_totals.json
          git diff --staged --quiet || git commit -m "Auto-snapshot starters"
          git push
