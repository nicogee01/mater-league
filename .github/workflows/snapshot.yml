# Logs head-to-head results every day after matches finish.
# The script does nothing if no new gameweek has been scored, so a daily run is safe.
name: Log gameweek results

on:
  schedule:
    - cron: "0 9 * * *"   # 09:00 UTC daily
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/snapshot.mjs
      - name: Commit new results
        run: |
          git config user.name "ny-maters-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Log gameweek results"
          git push
