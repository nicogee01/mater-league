<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hall of Records · The Mater League</title>
  <meta name="description" content="The numbers worth bragging about, or never living down." />
  <meta name="theme-color" content="#1b0020" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%2300ff85'/%3E%3Cpath d='M16 9l6 4.4-2.3 7h-7.4L10 13.4z' fill='%2337003c'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css?v=63" />
</head>
<body data-page="records">
  <main id="main">
    <header class="page-hero">
      <div class="page-hero__inner">
        <p class="eyebrow">Silverware and shame</p>
        <h1>Hall of Records</h1>
        <p class="page-hero__lede">The numbers worth bragging about, or never living down.</p>
      </div>
    </header>

    <section class="section section--page" aria-label="Hall of Records">
      <section class="rec-spot" id="recSpot" aria-roledescription="carousel" aria-label="Record spotlight" data-cat="glory">
        <span class="rec-spot__lights" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
        <div class="rec-spot__body">
          <p class="rec-spot__cat"><span class="rec-spot__icon"><svg viewBox="0 0 24 24" aria-hidden="true" id="spotIcon"></svg></span><span id="spotCat">Glory</span></p>
          <h2 class="rec-spot__title" id="spotTitle">Loading records…</h2>
          <div class="rec-spot__val" id="spotVal" role="img"></div>
          <div class="rec-spot__who" id="spotWho"></div>
          <p class="rec-spot__blurb" id="spotBlurb"></p>
        </div>
        <div class="rec-spot__controls">
          <button type="button" class="rec-spot__btn" id="spotPrev" aria-label="Previous record"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3L5 8l5 5"/></svg></button>
          <button type="button" class="rec-spot__btn" id="spotPause" aria-pressed="false" aria-label="Pause spotlight rotation"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="4" y="3" width="3" height="10"/><rect x="9" y="3" width="3" height="10"/></svg></button>
          <button type="button" class="rec-spot__btn" id="spotNext" aria-label="Next record"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3l5 5-5 5"/></svg></button>
          <span class="rec-spot__count" id="spotCount"></span>
        </div>
        <span class="rec-spot__prog" id="spotProg" aria-hidden="true"></span>
      </section>

      <div class="rec-board reveal">
        <div class="rec-board__bar">
          <p class="rec-board__title">The records board</p>
          <div class="filters" id="recFilters" role="group" aria-label="Filter records">
            <button class="chip is-active" data-filter="all" aria-pressed="true">All</button>
            <button class="chip" data-filter="glory" aria-pressed="false">Glory</button>
            <button class="chip" data-filter="shame" aria-pressed="false">Shame</button>
            <button class="chip" data-filter="market" aria-pressed="false">Transfer market</button>
            <button class="chip" data-filter="matchday" aria-pressed="false">Matchday</button>
          </div>
        </div>
        <ol class="rec-rows" id="recRows"></ol>
        <p class="rec-board__note">Pick any record to put it in the spotlight. Locked rows unlock once matchups are logged.</p>
      </div>
    </section>
  </main>

  <script src="js/layout.js?v=63"></script>
  <script src="data/league.js?v=63"></script>
  <script src="js/motion.js?v=63"></script>
  <script src="js/app.js?v=63"></script>
</body>
</html>
