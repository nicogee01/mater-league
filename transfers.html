<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Transfer window · The Mater League</title>
  <meta name="description" content="Every completed waiver claim, free-agent signing and trade." />
  <meta name="theme-color" content="#1b0020" />
  <script>try{if(localStorage.getItem("mater-theme")==="dark")document.documentElement.dataset.theme="dark"}catch(e){}</script>
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="apple-mobile-web-app-title" content="Mater League" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css?v=115" />
</head>
<body data-page="transfers">
  <main id="main">
    <header class="page-hero">
      <div class="page-hero__inner">
        <p class="eyebrow">Deadline day, every day</p>
        <h1>Transfer window</h1>
        <p class="page-hero__lede">Every completed waiver claim, free-agent signing and trade.</p>
      </div>
    </header>

    <section class="section section--page" aria-label="Transfer window">
      <div class="market">
      <div class="market__main">
      <div class="filters reveal" id="transfers-filters" role="group" aria-label="Filter transfers">
        <button class="chip is-active" data-filter="all" aria-pressed="true">All</button>
        <button class="chip" data-filter="waiver" aria-pressed="false">Waivers</button>
        <button class="chip" data-filter="free_agent" aria-pressed="false">Free agents</button>
        <button class="chip" data-filter="trade" aria-pressed="false">Trades</button>
      </div>
      <div class="gw-groups" id="gwGroups"><div class="skeleton"></div></div>
      </div>
      <aside class="market__side" aria-label="Transfer market summary">
        <section class="side-card reveal">
          <h2 class="side-card__title">Window totals</h2>
          <div class="mk-stats" id="mkTotals"></div>
        </section>
        <section class="side-card reveal">
          <h2 class="side-card__title">FAAB remaining <small id="mkBudget"></small></h2>
          <ol class="mk-list" id="mkFaab"></ol>
        </section>
        <section class="side-card reveal">
          <h2 class="side-card__title">Biggest spenders</h2>
          <ol class="mk-list" id="mkSpend"></ol>
        </section>
        <section class="side-card reveal">
          <h2 class="side-card__title">Most active</h2>
          <ol class="mk-list" id="mkBusy"></ol>
        </section>
      </aside>
      </div>
    </section>
  </main>

  <script src="js/layout.js?v=115"></script>
  <script src="data/league.js?v=115"></script>
  <script src="js/motion.js?v=115"></script>
  <script src="js/app.js?v=115"></script>
</body>
</html>
